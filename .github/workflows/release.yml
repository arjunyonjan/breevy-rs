name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          cd target/release
          zip -j "$GITHUB_WORKSPACE/breevy-rs-linux-x86_64.zip" breevy-rs
      - uses: softprops/action-gh-release@v2
        with:
          files: breevy-rs-linux-x86_64.zip
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/breevy-rs.exe -DestinationPath breevy-rs-win64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: breevy-rs-win64.zip
