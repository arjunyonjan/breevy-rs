name: gui-screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Run GUI and capture
        shell: pwsh
        env:
          BREEVY_RENDERER: wgpu
          RUST_BACKTRACE: "1"
        run: |
          $p = Start-Process -FilePath "target\release\breevy-rs.exe" -ArgumentList "sample.bvy" -PassThru -RedirectStandardOutput "$PWD\app-win.log" -RedirectStandardError "$PWD\app-win.err"
          Start-Sleep -Seconds 15
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.X, $b.Y, 0, 0, $b.Size)
          $bmp.Save("$PWD\shot-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()
          Add-Content app-win.log "--- processes ---"
          Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { Add-Content app-win.log ("WINDOW: " + $_.ProcessName + " | " + $_.MainWindowTitle) }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: shot-windows
          path: |
            shot-windows.png
            app-win.log
            app-win.err
          if-no-files-found: warn

  linux-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick libgl1-mesa-dri libegl1
      - name: Build
        run: cargo build --release
      - name: Run GUI under Xvfb and capture root
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" bash -c './target/release/breevy-rs sample.bvy > app.log 2>&1 & sleep 10; import -window root shot-linux.png; cat app.log'
      - uses: actions/upload-artifact@v4
        with:
          name: shot-linux
          path: |
            shot-linux.png
            app.log
